name: Replace index.html with art-website.html
on:
  workflow_dispatch:
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with art-website.html
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f index.html
          git mv art-website.html index.html
          git commit -m "Replace index.html with updated art-website.html"
          git push
